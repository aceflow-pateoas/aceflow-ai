[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aceflow-ai"
version = "3.0.0"
description = "AI-Driven Contract-First Development Framework with Intelligent Workflow Management"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AceFlow Team", email = "team@aceflow.dev"}
]
maintainers = [
    {name = "AceFlow Team", email = "team@aceflow.dev"}
]
keywords = [
    "ai", "workflow", "contract-first", "development", "pateoas",
    "state-machine", "memory-system", "template-engine", "mcp",
    "quality-gates", "agile", "software-development"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    # Core dependencies
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",

    # Workflow system
    "jinja2>=3.0.0",
    "python-dateutil>=2.8.0",

    # Data processing
    "psutil>=5.9.0",
    "aiofiles>=23.0.0",

    # MCP integration (optional, from aceflow-mcp-server)
    # Users can install aceflow-mcp-server separately if needed
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
mcp = [
    "mcp>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "starlette>=0.27.0",
    "requests>=2.28.0",
]
export = [
    "markdown>=3.4.0",
    "jinja2>=3.1.0",
]
all = [
    "aceflow-ai[dev,mcp,export]",
]

[project.urls]
Homepage = "https://github.com/aceflow-ai/aceflow-ai"
Documentation = "https://github.com/aceflow-ai/aceflow-ai/tree/main/docs"
Repository = "https://github.com/aceflow-ai/aceflow-ai.git"
Issues = "https://github.com/aceflow-ai/aceflow-ai/issues"
Changelog = "https://github.com/aceflow-ai/aceflow-ai/blob/main/CHANGELOG.md"

[project.scripts]
# Main CLI entry point (if needed in future)
# aceflow = "aceflow.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aceflow*"]
exclude = ["tests*", "aceflow-mcp-server*"]

[tool.black]
line-length = 100
target-version = ['py38']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | aceflow-mcp-server
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["aceflow-mcp-server"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["aceflow-mcp-server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "workflow: marks workflow related tests",
    "mcp: marks MCP tool related tests",
]
