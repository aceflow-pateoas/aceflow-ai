[tool:pytest]
# pytest 配置文件

# 测试发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short

# 标记定义
markers =
    slow: 标记运行较慢的测试
    integration: 标记集成测试
    unit: 标记单元测试
    workflow: 标记工作流相关测试
    mcp: 标记 MCP 工具相关测试
    contract: 标记契约管理相关测试

# 覆盖率配置
[coverage:run]
source = aceflow
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
