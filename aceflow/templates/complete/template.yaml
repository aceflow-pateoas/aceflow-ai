# Complete 模式项目模板
# 适合企业级项目和大型系统开发

project:
  name: "新建项目"
  template: "complete"
  team_size: "10+人"
  estimated_duration: "2周以上"
  description: "完整的10阶段AceFlow流程，包含需求分析、架构设计、开发、测试、性能测试和代码审查"

flow:
  mode: "complete"
  stages:
    - id: "requirement_analysis"
      name: "需求分析"
      description: "分析项目需求，定义功能范围和验收标准"
      template: "requirement_analysis.md"
      estimated_duration: "2-3天"
      quality_gates:
        - "核心功能需求明确"
        - "验收标准清晰"
        - "约束条件识别完整"

    - id: "architecture_design"
      name: "架构设计"
      description: "设计系统架构、技术选型和数据模型"
      template: "architecture_design.md"
      estimated_duration: "3-5天"
      quality_gates:
        - "架构设计完整"
        - "技术选型合理"
        - "接口设计符合规范"

    - id: "user_stories"
      name: "用户故事分析"
      description: "编写详细的用户故事和验收标准"
      template: "user_stories.md"
      estimated_duration: "2-3天"
      quality_gates:
        - "用户故事符合INVEST原则"
        - "验收标准明确可测试"
        - "优先级划分合理"

    - id: "task_breakdown"
      name: "任务分解"
      description: "将用户故事分解为具体的开发任务"
      template: "task_breakdown.md"
      estimated_duration: "1-2天"
      quality_gates:
        - "任务粒度合理（≤8小时）"
        - "依赖关系清晰"
        - "工时估算准确"

    - id: "test_design"
      name: "测试用例设计"
      description: "设计测试用例和测试策略"
      template: "test_design.md"
      estimated_duration: "2-3天"
      quality_gates:
        - "测试用例覆盖所有功能"
        - "测试数据准备完整"
        - "测试环境就绪"

    - id: "implementation"
      name: "功能实现"
      description: "按照任务清单进行功能开发"
      template: "implementation.md"
      estimated_duration: "主要开发周期"
      quality_gates:
        - "代码符合规范"
        - "功能实现完整"
        - "代码审查通过"

    - id: "unit_test"
      name: "单元测试"
      description: "执行单元测试，确保代码质量"
      template: "unit_test.md"
      estimated_duration: "2-3天"
      quality_gates:
        - "测试用例全部通过"
        - "代码覆盖率 ≥ 80%"
        - "无关键缺陷"

    - id: "integration_test"
      name: "集成测试"
      description: "执行集成测试，验证模块间集成"
      template: "integration_test.md"
      estimated_duration: "3-5天"
      quality_gates:
        - "集成测试通过率 ≥ 95%"
        - "接口测试覆盖完整"
        - "严重缺陷已修复"

    - id: "performance_test"
      name: "性能测试"
      description: "执行性能测试，优化系统性能（可选）"
      template: "performance_test.md"
      estimated_duration: "2-3天"
      required: false
      quality_gates:
        - "性能指标达标"
        - "系统稳定性良好"
        - "资源使用合理"

    - id: "code_review"
      name: "代码审查"
      description: "全面审查代码质量和安全性"
      template: "code_review.md"
      estimated_duration: "2-3天"
      quality_gates:
        - "代码质量评分 ≥ 8/10"
        - "严重问题修复率 100%"
        - "代码规范符合标准"

quality_standards:
  code_coverage: ">= 80%"
  test_pass_rate: ">= 95%"
  code_quality_score: ">= 8.0/10"
  performance_target: "P95 < 1s"

best_practices:
  - "所有阶段产出物及时归档"
  - "质量门控检查严格执行"
  - "定期进行阶段回顾"
  - "持续集成和自动化测试"
